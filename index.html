<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Daily Point</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 25px 0;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 25px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 25px;
    }

    .subtitle {
      color: #8d9aad;
      margin-top: 6px;
    }

    .balance {
      background: linear-gradient(135deg, #1769ff, #073baf);
      border-radius: 22px;
      padding: 25px;
      text-align: center;
      margin: 15px 0;
    }

    .balance-label {
      color: #d8e5ff;
      font-size: 14px;
    }

    .points {
      font-size: 38px;
      font-weight: bold;
      margin: 8px 0;
    }

    .card {
      background: #101d2d;
      border-radius: 18px;
      padding: 18px;
      margin: 12px 0;
    }

    .card h3 {
      margin-bottom: 7px;
    }

    .card p {
      color: #91a0b3;
      font-size: 14px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 14px;
      background: #1769ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:active {
      transform: scale(.98);
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .nav button {
      background: #101d2d;
      font-size: 12px;
      padding: 12px 5px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>Task Daily Point</h1>
    <div class="subtitle">Complete tasks. Earn points.</div>
  </div>

  <div class="balance">
    <div class="balance-label">YOUR POINTS</div>
    <div class="points" id="points">0</div>
    <div class="balance-label">Daily Points</div>
  </div>

  <div class="card">
    <h3>Daily Check-in</h3>
    <p>Claim your daily points and keep your streak active.</p>
    <button onclick="dailyCheckIn()">Claim +100 Points</button>
  </div>

  <div class="card">
    <h3>Complete Tasks</h3>
    <p>Complete simple tasks and earn more points.</p>
    <button onclick="showMessage()">View Tasks</button>
  </div>

  <div class="card">
    <h3>Invite Friends</h3>
    <p>Invite friends and earn referral points.</p>
    <button onclick="showMessage()">Invite Friends</button>
  </div>

  <div class="nav">
    <button>Home</button>
    <button>Tasks</button>
    <button>Friends</button>
    <button>Profile</button>
  </div>

</div>

<script>
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  let points = 0;

  function dailyCheckIn() {
    points += 100;
    document.getElementById("points").innerText =
      points.toLocaleString();

    tg.showAlert("Congratulations! You earned 100 points.");
  }

  function showMessage() {
    tg.showAlert("This section will be available soon.");
  }
</script>

</body>
</html>
